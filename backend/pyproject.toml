[project]
name = "climate-hazard-analyzer-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/services/insights.py" = ["E501"]  # human-readable sentences
